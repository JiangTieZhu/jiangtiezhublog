{{ define "main" }}
<h1 class="page-title">搜索</h1>

<div class="search-box">
  <input
    id="search-input"
    type="search"
    placeholder="输入关键词，标题 / 正文 / 标签…"
    autocomplete="off"
    autofocus
    aria-label="搜索文章"
    data-search-index="{{ "searchindex.json" | relURL }}"
  />
  <div class="search-meta" id="search-meta" aria-live="polite"></div>
</div>

<div id="search-results" class="search-results"></div>

{{ $searchJS := resources.Get "js/search.js" }}
{{ $searchJS = $searchJS | minify | fingerprint }}
<script src="{{ $searchJS.RelPermalink }}" integrity="{{ $searchJS.Data.Integrity }}" defer></script>
{{ end }}
