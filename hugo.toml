baseURL = "https://cyberbackgarden.top/"
locale = "zh-cn"
title = "赛博后花园"
theme = "cybergarden"
hasCJKLanguage = true
pluralizeListTitles = false
capitalizeListTitles = true

# 首页额外输出 searchindex.json，供前端搜索使用
[outputs]
  home = ["HTML", "RSS", "SearchIndex"]

[outputFormats]
  [outputFormats.SearchIndex]
    mediaType = "application/json"
    baseName = "searchindex"
    isPlainText = true
    notAlternative = true

[params]
  description = "这是一个人的博客，写一些不合时宜的想法。"
  mainSections = ["post"]

[menu]
  [[menu.main]]
    name = "分类"
    url = "/categories/"
    weight = 1
  [[menu.main]]
    name = "归档"
    url = "/archives/"
    weight = 2
  [[menu.main]]
    name = "标签"
    url = "/tags/"
    weight = 3
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 4
  [[menu.main]]
    name = "搜索"
    url = "/search/"
    weight = 5
