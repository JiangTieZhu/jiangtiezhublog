{{ define "main" }}

<header class="section-title">
    <h1>{{ .Title }}</h1>
</header>


{{ range (.Site.RegularPages.GroupByDate "2006") }}

<h2 id="{{ .Key }}">
    {{ .Key }}
</h2>


<ul>

{{ range .Pages }}

<li>

<time>
{{ .Date.Format "2006-01-02" }}
</time>

<a href="{{ .RelPermalink }}">
    {{ .Title }}
</a>

</li>

{{ end }}

</ul>


{{ end }}


{{ end }}
