<section class="widget archives">
    <h2 class="widget-title">
        归档
    </h2>

    <div class="widget-content">
        {{ range (.Context.Site.RegularPages.GroupByDate "2006") }}
        <div class="archive-item">

            <a href="/archives/#{{ .Key }}">
                {{ .Key }}
                <span>
                    ({{ len .Pages }})
                </span>
            </a>

        </div>
        {{ end }}
    </div>
</section>
